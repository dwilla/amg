<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Acute Medical Gas Services</title>
    <meta name="description" content="Contact Acute Medical Gas Services. 24 hour phone 1-603-487-3800. 470 Mast Road, Suite B, Goffstown, NH 03045.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/styles.css">
</head>
<body data-page="contact">

    <!-- include:banner -->
    <!-- include:header -->
    <!-- include:nav -->

    <section class="page-hero">
        <div class="container">
            <h1 class="page-title">Contact Us</h1>
            <div class="breadcrumb-nav"><a href="index.html">Home</a><span>/</span>Contact Us</div>
        </div>
    </section>

    <section class="page-body">
        <div class="container">
            <div class="columns is-variable is-6">
                <div class="column is-5">
                    <div class="contact-info-card">
                        <h3>Get In Touch</h3>
                        <div class="info-row">
                            <i class="fas fa-location-dot"></i>
                            <span>470 Mast Road, Suite B<br>Goffstown, NH 03045</span>
                        </div>
                        <div class="info-row">
                            <i class="fas fa-phone"></i>
                            <span>24 Hour Phone:<br><a href="tel:16034873800">1-603-487-3800</a></span>
                        </div>
                        <div class="info-row">
                            <i class="fas fa-envelope"></i>
                            <span>Email:<br><a href="mailto:Support@AcuteMedGas.com">Support@AcuteMedGas.com</a></span>
                        </div>
                    </div>
                </div>

                <div class="column is-7">
                    <form class="contact-form" onsubmit="event.preventDefault(); this.reset(); document.getElementById('form-success').style.display='block';">
                        <div id="form-success" class="info-box" style="display:none;">
                            Thank you! Your message has been received and we will be in touch shortly.
                        </div>

                        <div class="field">
                            <label class="label">Name</label>
                            <div class="control">
                                <input class="input" type="text" name="name" placeholder="First Last" required>
                            </div>
                        </div>

                        <div class="columns">
                            <div class="column">
                                <div class="field">
                                    <label class="label">Email</label>
                                    <div class="control">
                                        <input class="input" type="email" name="email" placeholder="you@example.com" required>
                                    </div>
                                </div>
                            </div>
                            <div class="column">
                                <div class="field">
                                    <label class="label">Phone</label>
                                    <div class="control">
                                        <input class="input" type="tel" name="phone" placeholder="(000) 000-0000">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Company</label>
                            <div class="control">
                                <input class="input" type="text" name="company" placeholder="Company / Organization">
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Address</label>
                            <div class="control">
                                <input class="input" type="text" name="address" placeholder="Street Address" style="margin-bottom:0.5rem;">
                            </div>
                            <div class="columns">
                                <div class="column"><input class="input" type="text" name="city" placeholder="City"></div>
                                <div class="column"><input class="input" type="text" name="state" placeholder="State / Province"></div>
                                <div class="column"><input class="input" type="text" name="zip" placeholder="ZIP / Postal Code"></div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">How can we help you?</label>
                            <div class="control">
                                <div class="select is-fullwidth">
                                    <select name="topic">
                                        <option value="">Please select&hellip;</option>
                                        <option>Code / Compliance Question</option>
                                        <option>Quote for Equipment</option>
                                        <option>Training</option>
                                        <option>Press</option>
                                        <option>General Inquiry</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Comment / Question</label>
                            <div class="control">
                                <textarea class="textarea" name="message" rows="5" placeholder="How can we help?"></textarea>
                            </div>
                        </div>

                        <div class="field">
                            <div class="control">
                                <button type="submit" class="contact-submit">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- include:footer -->

</body>
</html>
